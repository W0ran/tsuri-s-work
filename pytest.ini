[pytest]
testpaths = tests
addopts = -ra -m "not full_sweep"
markers =
    applicant: тесты роли Заявитель
    expert: тесты роли Эксперт
    admin: тесты роли Администратор
    predsedatel: тесты роли Председатель совета
    sovet_tsuri: тесты роли Член совета
    workflows: сквозные сценарии между ролями
    security: тесты безопасности (кибератаки)
    slow: длительные тесты, запускаемые отдельно
    full_sweep: полный перебор полей формы с SQLi payload'ами
